name: Publish to npm

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for staged trusted publishing support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Build the package
        run: npm run build

      - name: Stage publish to npm
        run: npm stage publish --provenance
